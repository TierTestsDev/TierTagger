name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and publish Fabric
        run: ./gradlew build publishMods --stacktrace

      - name: Build and publish Forge 1.8.9
        working-directory: legacy
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew build publishMods --stacktrace

      - name: Release notes
        run: |
          version=$(grep '^mod.version' stonecutter.properties.toml | cut -d'"' -f2)
          awk -v v="## $version" '$0 == v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: |
            versions/*/build/libs/*.jar
            legacy/build/libs/*.jar
            !legacy/build/libs/*-dev.jar

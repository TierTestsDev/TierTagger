name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric:
    name: Fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: fabric
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

  forge:
    name: Forge 1.8.9
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: forge
          path: |
            legacy/build/libs/*.jar
            !legacy/build/libs/*-dev.jar
          if-no-files-found: error
